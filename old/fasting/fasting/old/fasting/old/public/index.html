<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fasting</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ====== صفحة الدخول ====== -->
    <div id="loginPage">
        <div class="login-container">
            <div class="login-header">
                <div class="logo-circle">F</div>
                <h1>Fasting</h1>
                <p id="loginSub">سجل حساب جديد</p>
            </div>

            <div class="login-form">
                <input type="text" id="usernameInput" placeholder="اسم المستخدم" />
                <input type="password" id="passwordInput" placeholder="كلمة السر (6 أحرف فأكثر)" />
                
                <button id="loginBtn" onclick="handleAuth()">تسجيل حساب</button>

                <div class="login-options">
                    <span id="toggleLogin" onclick="toggleMode()">لدي حساب بالفعل</span>
                    <span id="toggleRecover" onclick="toggleRecover()">نسيت كلمة السر؟</span>
                </div>

                <div id="recoverBox" style="display:none; margin-top:15px;">
                    <input type="text" id="recoverUsername" placeholder="اسم المستخدم" />
                    <input type="text" id="recoverId" placeholder="الـ ID" />
                    <button onclick="recoverAccount()">استرجاع</button>
                    <div id="recoverResult" style="margin-top:10px; font-size:14px;"></div>
                </div>

                <div id="userIdDisplay" style="display:none; margin-top:20px; background:#0f3460; padding:14px; border-radius:12px;">
                    <p style="color:#fff; margin:0;">معرفك: <span id="userIdSpan" style="color:#25d366; font-weight:bold;"></span></p>
                    <p style="font-size:12px; color:#aaa; margin:6px 0 0;">انسخه وأرسله لأصدقائك</p>
                </div>

                <div id="errorMsg" style="color:#ff6b6b; margin-top:12px; font-size:14px;"></div>
            </div>
        </div>
    </div>

    <!-- ====== واجهة التطبيق ====== -->
    <div id="app" style="display:none;">
        <div class="app-header">
            <div class="header-info">
                <div class="avatar">F</div>
                <div>
                    <div id="headerUsername" style="font-weight:bold; font-size:17px;"></div>
                    <div id="headerId" style="font-size:12px; color:#aaa;"></div>
                </div>
            </div>
            <button onclick="openSettings()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">⚙️</button>
        </div>

        <div class="app-body">
            <!-- قائمة المحادثات -->
            <div id="chatList" class="chat-list">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="بحث..." oninput="searchFriends()" />
                </div>

                <div class="search-box" style="margin-top:8px;">
                    <input type="text" id="addFriendInput" placeholder="إضافة صديق بالـ ID" />
                    <button onclick="sendFriendRequest()">إضافة</button>
                </div>
                <div id="requestStatus" style="font-size:13px; color:#25d366; padding:5px;"></div>

                <!-- FastingAI -->
                <div class="friend-item" onclick="openFastingAI()" style="background: linear-gradient(135deg, #1a1a2e, #0f3460); border: 1px solid #25d366;">
                    <span class="friend-avatar" style="font-size:26px;">🤖</span>
                    <div style="flex:1;">
                        <div style="font-weight:600;">FastingAI</div>
                        <div style="font-size:12px; color:#25d366;">الذكاء الاصطناعي</div>
                    </div>
                </div>

                <div id="friendsContainer"></div>
                <div id="pendingRequests"></div>

                <hr style="border-color:#2a2a3e; margin:12px 0;" />

                <div style="display:flex; gap:8px; margin:10px 0;">
                    <input type="text" id="groupNameInput" placeholder="اسم المجموعة" style="flex:1; padding:8px; border:none; border-radius:8px; background:#0f3460; color:white;" />
                    <input type="text" id="groupMembersInput" placeholder="IDs مفصولة بفاصلة" style="flex:1; padding:8px; border:none; border-radius:8px; background:#0f3460; color:white;" />
                    <button onclick="createGroup()" style="padding:8px 14px; background:#25d366; border:none; border-radius:8px; color:white; font-weight:bold;">+</button>
                </div>
                <div id="groupsContainer"></div>
            </div>

            <!-- المحادثة الفردية -->
            <div id="chatArea" class="chat-area" style="display:none; flex-direction:column; flex:1;">
                <div class="chat-header-area" style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#075e54; color:white;">
                    <div>
                        <span id="chatWithUser" style="font-weight:bold; font-size:17px;"></span>
                        <span id="chatWithId" style="font-size:12px; color:#aaa; display:block;"></span>
                    </div>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button onclick="document.getElementById('imageInput').click()" style="background:none; border:none; color:white; font-size:20px;">📷</button>
                        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="sendImage()" />
                        <button onclick="backToChatList()" style="background:none; border:none; color:#25d366; font-size:24px;">←</button>
                    </div>
                </div>
                <div id="messagesContainer" class="messages-container"></div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="اكتب رسالة..." />
                    <button onclick="sendMessage()">➤</button>
                </div>
            </div>

            <!-- محادثة FastingAI -->
            <div id="aiChatArea" class="chat-area" style="display:none; flex-direction:column; flex:1;">
                <div class="chat-header-area" style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#075e54; color:white;">
                    <div>
                        <span style="font-weight:bold; font-size:17px;">🤖 FastingAI</span>
                        <span style="font-size:12px; color:#aaa; display:block;">الذكاء الاصطناعي</span>
                    </div>
                    <button onclick="backToChatList()" style="background:none; border:none; color:#25d366; font-size:24px;">←</button>
                </div>
                <div id="aiMessagesContainer" class="messages-container"></div>
                <div class="chat-input-area">
                    <input type="text" id="aiMessageInput" placeholder="اسأل FastingAI..." />
                    <button onclick="sendAIMessage()">➤</button>
                </div>
            </div>

            <!-- المحادثة الجماعية -->
            <div id="groupChatArea" class="chat-area" style="display:none; flex-direction:column; flex:1;">
                <div class="chat-header-area" style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#075e54; color:white;">
                    <span id="groupChatWithUser" style="font-weight:bold; font-size:17px;"></span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button onclick="document.getElementById('groupImageInput').click()" style="background:none; border:none; color:white; font-size:20px;">📷</button>
                        <input type="file" id="groupImageInput" accept="image/*" style="display:none;" onchange="sendImage()" />
                        <button onclick="backToChatList()" style="background:none; border:none; color:#25d366; font-size:24px;">←</button>
                    </div>
                </div>
                <div id="groupMessagesContainer" class="messages-container"></div>
                <div class="chat-input-area">
                    <input type="text" id="groupMessageInput" placeholder="اكتب رسالة للمجموعة..." />
                    <button onclick="sendGroupMessage()">➤</button>
                </div>
            </div>

            <!-- الإعدادات -->
            <div id="settingsPage" style="display:none; flex-direction:column; flex:1; background:#0f0f1a; padding:20px; overflow-y:auto;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="color:white;">الإعدادات</h2>
                    <button onclick="closeSettings()" style="background:none; border:none; color:white; font-size:26px;">✕</button>
                </div>

                <div style="background:#1a1a2e; border-radius:12px; padding:15px; margin-bottom:15px;">
                    <h3 style="color:white; margin-bottom:12px;">الحساب</h3>
                    <button onclick="changeUsername()" style="width:100%; padding:12px; margin:5px 0; background:#0f3460; border:none; border-radius:8px; color:white; text-align:right;">تغيير الاسم</button>
                    <button onclick="changePassword()" style="width:100%; padding:12px; margin:5px 0; background:#0f3460; border:none; border-radius:8px; color:white; text-align:right;">تغيير كلمة السر</button>
                    <button onclick="copyId()" style="width:100%; padding:12px; margin:5px 0; background:#0f3460; border:none; border-radius:8px; color:white; text-align:right;">نسخ الـ ID</button>
                    <button onclick="confirmLogout()" style="width:100%; padding:12px; margin:5px 0; background:#e74c3c; border:none; border-radius:8px; color:white; text-align:right;">تسجيل الخروج</button>
                </div>

                <!-- قسم الإدارة -->
                <div style="background:#1a1a2e; border-radius:12px; padding:15px; margin-bottom:15px;">
                    <h3 style="color:#f1c40f; margin-bottom:12px;">إدارة عليا</h3>
                    <input type="text" id="adminUserId" placeholder="ID المستخدم" style="width:100%; padding:10px; margin:5px 0; border:none; border-radius:8px; background:#0f3460; color:white;" />
                    <input type="text" id="adminNewPassword" placeholder="كلمة السر الجديدة" style="width:100%; padding:10px; margin:5px 0; border:none; border-radius:8px; background:#0f3460; color:white;" />
                    <button onclick="adminResetPassword()" style="width:100%; padding:12px; margin-top:8px; background:#f1c40f; border:none; border-radius:8px; color:#000; font-weight:bold;">إعادة تعيين كلمة السر</button>
                </div>

                <div style="background:#1a1a2e; border-radius:12px; padding:15px;">
                    <h3 style="color:white; margin-bottom:10px;">حول</h3>
                    <p style="color:#888; font-size:14px; text-align:center;">
                        Fasting<br>
                        الإصدار 2.1
                    </p>
                </div>
            </div>

            <div id="emptyChat" class="empty-chat" style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; color:#555;">
                <span style="font-size:50px; margin-bottom:10px;">💬</span>
                <p>اختر محادثة للبدء</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="customModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.65); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:#1a1a2e; border-radius:18px; padding:28px 22px; max-width:360px; width:90%; text-align:center;">
            <div id="modalIcon" style="font-size:42px; margin-bottom:10px;">✅</div>
            <h3 id="modalTitle" style="color:white; margin-bottom:8px;">تم</h3>
            <p id="modalMessage" style="color:#aaa; margin-bottom:18px; line-height:1.5;"></p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="modalConfirmBtn" style="padding:11px 28px; background:#25d366; border:none; border-radius:10px; color:white; font-weight:bold;">موافق</button>
                <button id="modalCancelBtn" style="display:none; padding:11px 28px; background:#e74c3c; border:none; border-radius:10px; color:white; font-weight:bold;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
